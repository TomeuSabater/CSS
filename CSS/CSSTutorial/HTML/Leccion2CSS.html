<head>

  <style type="text/css">
	h1 {
		color:#ff0000;
		background-color:#ffff00;
	}
	h3 {
		color:#00ff00;
	}

<body>
	<h1>Ahora todos los h1 se escriben en rojo y fondo amarillo</h1>
	<h2>Esto es h2, por tanto no afectado</h2>
	<h1>Esto es h1, por tanto, afectado</h1>
	<h3>Esto es h3, por tanto, afectado</h3>
</body>

</html>
