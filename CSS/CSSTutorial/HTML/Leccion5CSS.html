<!DOCTYPE html>
<html lang="es">
<head>

  <title>Lección 5; Agrupación de reglas de estilo y complementar estilos</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style type="text/css">
    h1,h2,p {color:#ff0000;}
    h1,h2 {background-color:yellow}
  </style>

</head>

<body>

  <div>
    <h1>h1 tiene estilo</h1>
    <h2>h2 tiene estilo</h2>
    <h3>h3 no tiene estilo, se muestra el estilo por defecto (el estilo del navegador)</h3>
    <p>párrafo sí tienen estilo, se sobreescribe el estilo que tuviera por defecto con el nuevo</p>
  </div>

</body>
</html>
